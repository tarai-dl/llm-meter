services:
  llm-meter:
    build: .
    image: llm-meter:local
    ports:
      - "8765:8765"
    volumes:
      - /var/log/nginx:/logs:ro
      - llm-meter-data:/data
    environment:
      # Set LLM_METER_AUTH_TOKEN to require Bearer auth for the dashboard.
      # Leave unset for no auth (localhost-only deployments).
      - LLM_METER_AUTH_TOKEN=${LLM_METER_AUTH_TOKEN:-}
    command: ["serve", "--db", "/data/llm-meter.db", "--host", "0.0.0.0", "--port", "8765", "--auth-token", "${LLM_METER_AUTH_TOKEN}"]

volumes:
  llm-meter-data:
